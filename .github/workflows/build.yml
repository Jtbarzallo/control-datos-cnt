name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk ControlDatosCNT.apk
          cp bateria/build/outputs/apk/release/bateria-release.apk MonitorBateria.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Apps Android JAT v1.0.${{ github.run_number }}
          files: |
            ControlDatosCNT.apk
            MonitorBateria.apk
          make_latest: true
